name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Installs Gradle 9.2.1 itself, so no gradlew / wrapper jar is needed in the repo
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Build
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: VoidHotbar-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Publish release
        run: |
          rm -f build/libs/*-sources.jar
          gh release delete voidhotbar-latest --yes --cleanup-tag || true
          gh release create voidhotbar-latest build/libs/*.jar --title "VoidHotbar jar" --notes "Готовый мод" --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
